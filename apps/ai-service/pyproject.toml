[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "azure-identity>=1.25.2",
    "azure-keyvault>=4.2.0",
    "azure-storage-blob>=12.30.0",
    "codecarbon>=3.3.0",
    "docling>=2.119.0",
    "fastapi>=0.141.1",
    "ijson>=3.5.1",
    "joblib>=1.5.3",
    "langchain>=1.3.15",
    "langchain-core>=1.4.8",
    "langchain-text-splitters>=1.1.1",
    "openai>=2.54.0",
    "pdfplumber>=0.11.10",
    "psutil>=7.2.2",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.7.0",
    "tenacity>=9.1.4",
    "torch>=2.13.0",
    "torchvision>=0.25.0",
    "tqdm>=4.70.0",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "flake8-pyproject>=1.2.4",
    "lingua-language-detector>=2.2.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.flake8]
exclude = [
    ".git",
    ".github",
    ".idea",
    "env",
    "venv",
    "__pycache__",
    ".ipynb_checkpoints",
]

per-file-ignores = [
    "*/__init__.py: D104, F401",
]

extend-ignore = [
    "D103",
    "D107",
    "D205",
    "D400",
    "D401",
    "E203",
    "N813",
]

max-complexity = 8
max-line-length = 99
statistics = true

[tool.pytest.ini_options]
markers = ["integration: live API tests, run manually"]
asyncio_mode = "auto"

[tool.uv]
# transformers is transitive (sentence-transformers). Without the floor uv keeps
# the macOS fork on 5.8.x, which pip-audit flags (PYSEC-2026-3929, fixed 5.10.0).
constraint-dependencies = ["transformers>=5.10.0"]
