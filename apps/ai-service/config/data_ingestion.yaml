# config/data_ingestion.yaml
# Data ingestion configuration for the AI Service in the
# Brede Welvaart Scan at the City of Amsterdam.
#
# When adapting this to your environment, replace all values
# with the ones relevant for your organisation.
#
# Path resolution:
#   - All paths under openresearch/extraction/assembly/indexing/embedding are
#     STORAGE-RELATIVE prefixes (resolved against storage.base_dir for local,
#     or against the configured container for azure).
#   - ${source_root} is substituted from the top-level field below, so every
#     per-source prefix nests under the same root. Adding a new source = bump
#     source_root or copy this file.
#
# Resulting layout (same internal structure for both backends):
#   local:  data/openresearch/{openresearch,extracted,assembled,collections,embeddings}/...
#   azure:  data (container) -> openresearch/{openresearch,extracted,assembled,...}/...
# Future sources (e.g. raadsinformatie) live as siblings of ${source_root}/.

source_root: openresearch

storage:
  backend: local            # local | azure
  base_dir: data            # broad root: holds all sources (local)
  container: data           # broad root: holds all sources (azure)

openresearch:
  base_path: ${source_root}/openresearch
  lang: nl
  concurrency: 3
  pagelen: 100
  download_files: true
  follow_document_edges: true
  skip_existing: true
  cat:
    - article
    - document
    - research
    - text

extraction:
  primary_backend: docling
  fallback_backend: null  # pymupdf or null to disable fallback
  output_dir: ${source_root}/extracted
  docling:
    max_file_mb: 100        # Docling loads full layout model per page — keep low
    max_pages: 300
    min_text_fraction: 0.2  # skip PDFs where <20% of pages have real text
    min_char_density: 0.001 # skip praatplaten — image-heavy with sparse vector labels
  pymupdf:
    max_file_mb: 500        # PyMuPDF is much lighter on memory
    max_pages: 1000
    min_text_fraction: 0.0  # no density filtering — pymupdf handles image PDFs fine
    min_char_density: 0.0
  pdfplumber:
    max_file_mb: 200
    max_pages: 1000
    min_text_fraction: 0.0
    min_char_density: 0.0

assembly:
  output_dir: ${source_root}/assembled

indexing:
  collections_dir: ${source_root}/collections
  collections: [summaries, best_chunks]  # which collections to compile
  min_chars: 100      # skip chunks smaller than this (e.g. headings with no body)
  chunk_size: 1000    # for fixed window splitting when no sections are available
  chunk_overlap: 200

embedding:
  backend: azure                              # local | azure
  model: text-embedding-3-small
  # backend: local
  # model: intfloat/multilingual-e5-large
  # model: intfloat/multilingual-e5-small
  # model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  # Azure-only, text-embedding-3-* models. null = use model default (1536 for
  # 3-small, 3072 for 3-large). When set to a non-null integer, the cache dir
  # gets a "-d{dimensions}" suffix so it won't clobber existing full-dim caches.
  # 512 cuts index size ~3x with ~1-2% MTEB quality drop.
  dimensions: 512
  collection: best_chunks                       # which collection to serve at runtime
  collections_dir: ${source_root}/collections
  store_path: ${source_root}/embeddings

vector_store:
  # placeholder for when embed step is implemented
  provider: local

llm:
  backend: azure
  deployment: gpt-4o-mini
