server {
    listen       5174;
    server_name  localhost;

    # Serve everything under /pdf from the root dir
    location ^~ /pdf/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
