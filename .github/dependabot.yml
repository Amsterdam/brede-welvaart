version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      pnpm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: uv
    directory: /apps/ai-service
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      ai-service-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      container-images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # The ai-service base image must stay inside pyproject's requires-python
      # (>=3.13,<3.14); a "minor" bump to 3.14 makes uv fetch a root-owned
      # managed interpreter and the container crashes on start. Bump
      # requires-python + uv.lock first, then lift this ignore.
      - dependency-name: python
        update-types:
          - version-update:semver-minor

  - package-ecosystem: docker
    directory: /apps/ai-service-mock
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      mock-container-images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
